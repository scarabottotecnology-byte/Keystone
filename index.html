    <!--
      Aplica o tema antes do primeiro paint.

      Sem isto, o React só adiciona a classe na montagem e o usuário vê um
      flash branco a cada carregamento (FOUC). O script precisa ser inline e
      síncrono, no head, para rodar antes de o navegador pintar qualquer coisa.

      A chave e o padrão devem espelhar o ThemeProvider em src/app/.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("keystone-theme") || "dark";
          var resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
